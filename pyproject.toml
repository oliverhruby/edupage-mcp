[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edupage-mcp-full"
version = "0.6.0"
description = "Full-feature EduPage MCP server: timetables, grades, homework, meals (ordering), messages, role-aware student switching, 2FA, multi-school with automatic student discovery, tiered name matching, and student cache."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oliver HrubÃ½" }]
requires-python = ">=3.10"
keywords = ["mcp", "edupage", "education", "ai", "agent", "school", "timetable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp<2",
    "edupage-api>=0.12.7",
    # Pulled in transitively via requests <- edupage-api. Pinned explicitly so
    # the floor for CVE-2026-97687 / CVE-2026-97689 (fixed in 2.8.0) is
    # enforced in our own metadata instead of depending on the resolver.
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/oliverhruby/edupage-mcp"
Repository = "https://github.com/oliverhruby/edupage-mcp"
Issues = "https://github.com/oliverhruby/edupage-mcp/issues"

[project.scripts]
edupage-mcp-full = "edupage_mcp:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edupage_mcp = ["skills/school-day-summary/SKILL.md"]
