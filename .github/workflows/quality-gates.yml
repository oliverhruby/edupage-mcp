name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile server module
        run: python -m py_compile src/edupage_mcp/__init__.py

      - name: Install package from source
        run: python -m pip install --upgrade pip && python -m pip install .

  docker-mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MCP client dependency
        run: python -m pip install --upgrade pip && python -m pip install "mcp<2"

      - name: Build Docker image
        run: docker build -t edupage-mcp:ci .

      - name: MCP stdio handshake + tools list
        run: |
          python - <<'PY'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(
                  command="docker",
                  args=["run", "--rm", "-i", "edupage-mcp:ci"],
              )
              async with stdio_client(params) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      items = getattr(tools, "tools", []) or []
                      if len(items) < 40:
                          raise SystemExit(f"Expected >=40 tools, got {len(items)}")
                      print(f"MCP smoke OK, tools={len(items)}")

          asyncio.run(main())
          PY

      - name: HTTP auth mode smoke
        run: |
          python - <<'PY'
          import asyncio
          import socket
          import subprocess
          import time
          from contextlib import suppress

          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          IMAGE = "edupage-mcp:ci"
          URL_CANDIDATES = [
              "http://127.0.0.1:18000/mcp",
              "http://127.0.0.1:18000/",
          ]

          def run_cmd(args):
              subprocess.run(args, check=True)

          def cleanup(name: str):
              subprocess.run(["docker", "rm", "-f", name], check=False)

          def wait_for_port(port: int, timeout: float = 20.0):
              start = time.time()
              while time.time() - start < timeout:
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                      sock.settimeout(0.5)
                      if sock.connect_ex(("127.0.0.1", port)) == 0:
                          return
                  time.sleep(0.2)
              raise RuntimeError(f"Timed out waiting for 127.0.0.1:{port}")

          async def try_list_tools(headers=None):
              last_exc = None
              for url in URL_CANDIDATES:
                  try:
                      async with streamablehttp_client(url, headers=headers) as (
                          read_stream,
                          write_stream,
                          _,
                      ):
                          async with ClientSession(read_stream, write_stream) as session:
                              await session.initialize()
                              tools = await session.list_tools()
                              items = getattr(tools, "tools", []) or []
                              return len(items)
                  except Exception as exc:  # noqa: BLE001
                      last_exc = exc
              if last_exc is None:
                  raise RuntimeError("No URL candidates configured")
              raise last_exc

          async def expect_success(headers=None):
              count = await try_list_tools(headers=headers)
              if count < 40:
                  raise RuntimeError(f"Expected >=40 tools, got {count}")

          async def expect_success_with_retry(headers=None, timeout: float = 25.0):
              start = time.time()
              last_exc = None
              while time.time() - start < timeout:
                  try:
                      await expect_success(headers=headers)
                      return
                  except Exception as exc:  # noqa: BLE001
                      last_exc = exc
                      await asyncio.sleep(0.4)
              if last_exc is None:
                  raise RuntimeError("Timed out waiting for successful HTTP MCP handshake")
              raise last_exc

          async def expect_failure(headers=None):
              try:
                  await try_list_tools(headers=headers)
              except Exception:
                  return
              raise RuntimeError("Expected auth failure, but request succeeded")

          try:
              cleanup("edupage-http-noauth")
              run_cmd(
                  [
                      "docker",
                      "run",
                      "-d",
                      "--name",
                      "edupage-http-noauth",
                      "-p",
                      "18000:8000",
                      "-e",
                      "MCP_TRANSPORT=streamable-http",
                      IMAGE,
                  ]
              )
              wait_for_port(18000)
              asyncio.run(expect_success_with_retry())
              cleanup("edupage-http-noauth")

              cleanup("edupage-http-auth")
              run_cmd(
                  [
                      "docker",
                      "run",
                      "-d",
                      "--name",
                      "edupage-http-auth",
                      "-p",
                      "18000:8000",
                      "-e",
                      "MCP_TRANSPORT=streamable-http",
                      "-e",
                      "MCP_API_KEY=ci-test-key",
                      IMAGE,
                  ]
              )
              wait_for_port(18000)
              asyncio.run(expect_success_with_retry(headers={"Authorization": "Bearer ci-test-key"}))
              asyncio.run(expect_failure())
              asyncio.run(expect_failure(headers={"Authorization": "Bearer wrong-key"}))
          finally:
              with suppress(Exception):
                  cleanup("edupage-http-noauth")
              with suppress(Exception):
                  cleanup("edupage-http-auth")

          print("HTTP auth smoke OK")
          PY
