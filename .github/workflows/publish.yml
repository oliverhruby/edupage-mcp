name: Publish

# Publish edupage-mcp-full to PyPI using OpenID Connect (trusted publishing).
#
# One-time setup required on PyPI (no API token needed after that):
#   1. Create an account at https://pypi.org (free) if you don't have one.
#   2. Go to https://pypi.org/manage/projects/ and create a project named
#      `edupage-mcp-full`, or add a publisher to an existing project by opening
#      it -> "Publishing" -> "Add a new publisher".
#   3. Provider: GitHub Actions
#        Project name : edupage-mcp-full
#        Owner        : oliverhruby
#        Repository   : edupage-mcp
#        Workflow name: publish.yml        <- must match THIS filename
#        Environment  : release            <- (optional but recommended)
#   4. Click "Add". Done.
#
# After registering, pushing a tag like `v0.1.0` runs this workflow and uploads
# automatically. Ensure `version` in pyproject.toml matches the tag.
#
# NOTE: GitHub environment "release" must exist (Settings -> Environments) and,
# if restricted, be approved before the publish job runs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC trusted publishing to PyPI

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: python scripts/check_tag_matches_version.py

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (OIDC, no token)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/

      - name: Verify Glama entry (synced from MCP Registry)
        env:
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
        run: |
          if [ -z "${GLAMA_API_KEY}" ]; then
            echo "GLAMA_API_KEY not set — Glama directory check skipped."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GLAMA_API_KEY}" \
            https://glama.ai/api/mcp/v1/servers/oliverhruby/edupage-mcp)
          echo "Glama directory API status: ${STATUS} (200 = live)"
          if [ "${STATUS}" != "200" ]; then
            echo "::warning::Glama listing for oliverhruby/edupage-mcp is unreachable (${STATUS}). The listing syncs from the Official MCP Server Registry, so a failure here usually means the registry entry is wrong rather than Glama being slow — check https://glama.ai/mcp/servers/oliverhruby/edupage-mcp. Quality grading is covered separately by the glama-quality workflow."
          fi
